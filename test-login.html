<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录测试</title>
</head>
<body>
    <h1>登录 API 测试</h1>
    <div>
        <input type="text" id="username" placeholder="用户名" value="kelin.tan">
        <input type="password" id="password" placeholder="密码" value="tanzhuchao">
        <button onclick="testLogin()">测试登录</button>
    </div>
    <div id="result"></div>

    <script>
        async function testLogin() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const resultDiv = document.getElementById('result');
            
            try {
                const response = await fetch('http://localhost:8080/admin/api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username: username,
                        password: password
                    })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    resultDiv.innerHTML = `
                        <h3>登录成功!</h3>
                        <p><strong>Token:</strong> ${data.meta?.accessToken || '未获取到token'}</p>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
                    resultDiv.style.color = 'green';
                } else {
                    resultDiv.innerHTML = `
                        <h3>登录失败</h3>
                        <p>状态码: ${response.status}</p>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
                    resultDiv.style.color = 'red';
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <h3>请求错误</h3>
                    <p>${error.message}</p>
                `;
                resultDiv.style.color = 'red';
            }
        }
    </script>
</body>
</html>
