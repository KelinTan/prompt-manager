# GitLab CI/CD Pipeline for Application
image: registry-mirrors.saybot.net/ops/ci/node20-ossutil:latest

# 定义阶段
stages:
  - build
  - deploy

# 缓存 node_modules
cache:
  paths:
    - node_modules/
    - .npm/

variables:
  # npm 缓存配置
  npm_config_cache: "$CI_PROJECT_DIR/.npm"
  # 构建产物目录
  BUILD_DIR: "dist"
  APPLICATION_NAME: "aigc-admin"

# 定义可复用的构建模板
.build_template: &build_template
  stage: build
  before_script:
    - echo "开始构建应用..."
    - node --version
    - npm --version
  script:
    - echo "安装依赖..."
    - npm ci --cache .npm --prefer-offline
    - echo "构建项目..."
    - npm run ${BUILD_COMMAND}
    - echo "构建完成，验证构建产物..."
    - ls -la $BUILD_DIR/
  artifacts:
    paths:
      - $BUILD_DIR/
    expire_in: 1 week
  tags:
    - docker-ali

# 定义可复用的部署模板
.deploy_template: &deploy_template
  stage: deploy
  before_script:
    - ossutil config -e $OSS_ENDPOINT -i $OSS_ACCESS_KEY_ID -k $OSS_ACCESS_KEY_SECRET
  script:
    - ossutil sync $BUILD_DIR/ oss://$OSS_BUCKET_NAME/$APPLICATION_NAME/ --delete --force
    - |
      if [ -n "$OSS_CDN_ENDPOINT" ]; then
        echo "================================================"
        echo "🚀 部署成功！"
        echo "📍 项目访问地址: $OSS_CDN_ENDPOINT/$APPLICATION_NAME/index.html"
        echo "================================================"
      fi
  tags:
    - docker-ali

# 构建阶段 - Beta
build_beta:
  <<: *build_template
  variables:
    BUILD_COMMAND: "build:beta"
  only:
    - develop

# Beta 环境部署
deploy_beta:
  <<: *deploy_template
  dependencies:
    - build_beta
  environment:
    name: beta
  only:
    - develop

# 构建阶段 - Production
build_production:
  <<: *build_template
  variables:
    BUILD_COMMAND: "build:prod"
  only:
    - master

# Production 环境部署
deploy_production:
  <<: *deploy_template
  dependencies:
    - build_production
  environment:
    name: production
  only:
    - master
  when: manual  # 需要手动确认才能部署到生产环境